name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (tar.gz + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libgl-dev \
            libegl-dev \
            libdbus-1-dev \
            squashfs-tools \
            desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests & clippy
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build release binary, AppImage & tar.gz
        run: ./scripts/build-linux-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (zip + NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests & clippy
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows release binary, zip & installer
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value

          New-Item -ItemType Directory -Force -Path dist\staging | Out-Null
          Copy-Item target\release\liebert-dynamic-island.exe dist\staging\
          Copy-Item LICENSE.md, README.md dist\staging\

          Compress-Archive -Path dist\staging\* `
            -DestinationPath dist\liebert-dynamic-island-windows-x86_64.zip -Force

          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { $nsis = "$env:ProgramFiles\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "makensis.exe not found" }
          $root = (Get-Location).Path
          & $nsis "/DAPP_VERSION=$version" `
            "/DSTAGING_DIR=$root\dist\staging" `
            "/DOUT_FILE=$root\dist\liebert-dynamic-island-windows-x86_64-setup.exe" `
            installer\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Bundle AUR packaging files
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tar -C packaging/aur -czf "release-assets/liebert-dynamic-island-aur-${VERSION}.tar.gz" PKGBUILD .SRCINFO

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
