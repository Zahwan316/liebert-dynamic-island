[package]
name = "liebert-dynamic-island"
version = "0.1.13"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Lightweight native Rust Dynamic Island notification overlay for Windows and Linux"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "x11", "wayland"] }
egui_glow = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
directories = "6.0"
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }
ureq = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
kakasi = "0.1"
any_ascii = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
calloop = "0.13"
calloop-wayland-source = "0.3"
x11rb = { version = "0.13", default-features = false }

[profile.release]
lto = "fat"
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Liebert Dynamic Island"
identifier = "com.liebert.dynamic-island"
version = "0.1.13"
out-dir = "./target/installer"
# "nsis" menghasilkan installer .exe, "wix" menghasilkan installer .msi (keduanya mendukung uninstall Windows)
formats = ["nsis", "wix"]
resources = ["README.md"]
# icons = ["assets/icon.ico"] # Tambahkan file .ico lalu aktifkan baris ini untuk ikon installer & shortcut

