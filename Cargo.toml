[package]
name = "liebert-dynamic-island"
version = "0.1.0"
edition = "2024"
description = "Lightweight native Rust Dynamic Island notification overlay for Windows and Linux"

[features]
tz-iana = ["dep:chrono-tz"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
directories = "6.0"
ureq = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kakasi = "0.1"
any_ascii = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
tray-icon = { version = "0.27", default-features = false }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"] }
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }
zbus = "6.5"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
egui_glow = { version = "0.37", default-features = false }
glow = "0.17"
raw-window-handle = "0.6"
calloop = "0.13"
calloop-wayland-source = "0.3"

[profile.release]
lto = "fat"
strip = "symbols"
opt-level = "z"
codegen-units = 1
panic = "abort"

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Liebert Dynamic Island"
identifier = "com.liebert.dynamic-island"
version = "0.1.0"
out-dir = "./target/installer"
# "nsis" menghasilkan installer .exe, "wix" menghasilkan installer .msi (keduanya mendukung uninstall Windows)
formats = ["nsis", "wix"]
resources = ["README.md"]
# icons = ["assets/icon.ico"] # Tambahkan file .ico lalu aktifkan baris ini untuk ikon installer & shortcut

